version: "1.0"
name: "observatory-platform-first-kepler-contract"
description: "Platform-first MIG + Kepler partner contract for read/propose-only providers in v1."

naming:
  provider_id: "kepler"
  display_name: "Kepler"
  event_prefix: "agent.kepler"
  deprecated_labels:
    - "native_holmes"
    - "holmes-native"

base_urls:
  in_cluster: "http://observatory-api.observatory-platform.svc.cluster.local:8090"
  local_nodeport: "http://localhost:30090"
  local_kepler_service: "http://localhost:18080"

auth:
  type: "bearer"
  header: "Authorization"
  format: "Bearer <token>"
  token_env: "OBSERVATORY_TOKEN"
  dev_fallback_token: "observatory-dev-admin"

provider_capability_contract:
  required:
    - "read_context"
    - "propose_plan"
    - "explain_evidence"
    - "emit_confidence"
  execution_authority: "observatory-control-plane-only"
  provider_write_scope_v1: "read+propose"

mig_partner_apis:
  - method: "POST"
    path: "/v1/mig/providers/{provider_id}/evaluate"
  - method: "GET"
    path: "/v1/mig/providers/{provider_id}/plans/{plan_id}"
  - method: "POST"
    path: "/v1/mig/providers/{provider_id}/plans/{plan_id}/explain"
  - method: "GET"
    path: "/v1/mig/capabilities"
  - method: "POST"
    path: "/v1/mig/conformance/run"

observatory_agent_apis:
  - method: "POST"
    path: "/v1/agent/evaluations"
  - method: "GET"
    path: "/v1/agent/evaluations/{id}"
  - method: "POST"
    path: "/v1/agent/evaluations/{id}/simulate"
  - method: "POST"
    path: "/v1/agent/plans/{id}/approve"
  - method: "POST"
    path: "/v1/agent/plans/{id}/reject"
  - method: "POST"
    path: "/v1/agent/plans/{id}/execute"
  - method: "GET"
    path: "/v1/agent/plans/{id}/timeline"
  - method: "POST"
    path: "/v1/agent/shapes/{candidate_id}/promote"

read_context_apis:
  - method: "GET"
    path: "/v1/mig/status"
  - method: "GET"
    path: "/v1/observatory/entities"
  - method: "GET"
    path: "/v1/observatory/edges"
  - method: "GET"
    path: "/v1/dkm/overview"
    query:
      required: ["scope"]
  - method: "GET"
    path: "/v1/dkm/timeline"
    query:
      required: ["scope"]
      recommended: ["limit"]
  - method: "GET"
    path: "/v1/incidents"
  - method: "GET"
    path: "/v1/incidents/{id}/timeline"

event_and_audit_naming:
  - "agent.kepler.plan.generated"
  - "agent.kepler.plan.simulated"
  - "agent.kepler.plan.approved"
  - "agent.kepler.plan.executed"
  - "agent.kepler.plan.verified"
  - "agent.kepler.shape.candidate_created"
  - "agent.kepler.shape.promoted"

governance:
  approval_channel_v1: "observatory-ui-only"
  policy_simulation_required: true
  freeze_windows_required: true
  kill_switch_required: true
  provenance_required: true
  partner_certification: "strict"
